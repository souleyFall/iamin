packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 n'exécute aucun script d'installation par défaut. Seuls ceux-ci sont autorisés :
# ils téléchargent les moteurs de requêtes de Prisma.
# Dépendances de l'outil `prisma` (chargement de sa config, que nous n'utilisons pas) avec une
# faille « high » corrigée plus haut que ce que Prisma 6 demande. À retirer quand Prisma les
# relèvera lui-même (voir `pnpm audit --prod`).
overrides:
  deepmerge-ts: '^8.0.2' # GHSA-ggr8-5vv4-36mx
  effect: '^3.22.1' # ReDoS dans Schema.TemplateLiteral

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
