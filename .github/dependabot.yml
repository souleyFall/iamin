version: 2

updates:
  # Dépendances npm (pnpm) : un seul verrouillage à la racine couvre tout le workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-et-patch:
        update-types: [minor, patch]

  # Les actions GitHub utilisées par la CI (elles sont figées par empreinte).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Les images PostgreSQL des deux fichiers Compose (développement et production).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Les images de base du Dockerfile (Node, Caddy) : une mise à jour de sécurité de l'image
  # arrive ainsi dans une PR, comme celles des dépendances.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
