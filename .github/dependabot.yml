version: 2

updates:
  # Dépendances npm (pnpm) : un seul verrouillage à la racine couvre tout le workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-et-patch:
        update-types: [minor, patch]

  # Les actions GitHub utilisées par la CI (elles sont figées par empreinte).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # L'image PostgreSQL du docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  # L'entrée docker (Dockerfile) s'ajoute avec les images de production (PR 14).
