# Base de données de développement. L'API, elle, se lance avec `pnpm --filter @iamin/api dev`.
# Les identifiants viennent du fichier .env (jamais versionné) : copie .env.example et remplis-le.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définis POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définis POSTGRES_DB dans .env}
    # Accessible depuis cette machine uniquement, jamais depuis le réseau.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - iamin-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iamin-db:
